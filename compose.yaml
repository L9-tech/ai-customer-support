services:
  api:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - support_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  poller:
    build: .
    env_file: .env
    command: ["python", "-m", "app.poller"]
    profiles: ["live"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  support_data:
